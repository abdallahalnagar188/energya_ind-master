name: energya_ind
description: "Energya Industry App."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  cloud_firestore: ^5.6.0
  collection: ^1.19.0
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^8.1.7
  firebase_auth: ^5.3.4
  firebase_core: ^3.10.1
  firebase_storage: ^12.4.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  go_router: ^14.6.1
  intl: ^0.19.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  spreadsheet_decoder: ^2.3.0
  sqflite: ^2.4.1
  syncfusion_flutter_xlsio: ^28.2.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/logo.png"

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - images/
